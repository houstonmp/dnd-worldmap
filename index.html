<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drifting Isles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --ink: #1a2229;
    --sea: #1e3a4a;
    --brass: #b8893a;
    --fog: #e8ecef;
    --kelp: #4f6b4a;
    --rust: #e08a7a;
    --font: 'IM Fell English', Georgia, 'Times New Roman', serif;
  }
  html, body { height: 100%; margin: 0; background: var(--ink); }
  #map { height: 100%; background: var(--ink); font-family: var(--font); }

  /* Scrolling layers: a clipped box holding a 200%-wide strip of two copies */
  .scroll-layer { overflow: hidden; pointer-events: none; }
  .scroll-strip { display: flex; width: 200%; height: 100%; will-change: transform; }
  .scroll-strip img { display: block; width: 50%; height: 100%; max-width: none; user-select: none; }

  /* Shared text halo so names read on any background */
  .island-label span, .place-pin .name {
    white-space: nowrap;
    font-family: var(--font);
    color: var(--ink);
    text-shadow: 0 0 3px var(--fog), 0 0 6px var(--fog), 0 0 10px rgba(232, 236, 239, .8);
  }

  /* Island names (drift with the islands) */
  .island-label { background: none; border: none; }
  .island-label span {
    display: inline-block;
    transform: translate(-50%, -50%);
    font-style: italic;
    font-size: 17px;
  }

  /* Fixed pins (stay put on the base map) */
  .place-pin { background: none; border: none; }
  .place-pin .dot {
    position: absolute; left: 3px; top: 3px;
    width: 8px; height: 8px;
    background: var(--brass);
    border: 1px solid var(--ink);
    transform: rotate(45deg);
  }
  .place-pin .name {
    position: absolute; left: 18px; top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
  }

  /* Edit mode affordances */
  .editing .island-label span { cursor: move; outline: 1px dashed rgba(184, 137, 58, .9); padding: 0 4px; }
  .editing .place-pin { cursor: move; }
  .editing.leaflet-container { cursor: crosshair; }

  /* Panels */
  .drift-panel, .edit-panel {
    background: rgba(26, 34, 41, .9);
    color: var(--fog);
    border: 1px solid var(--brass);
    border-radius: 6px;
    font-family: var(--font);
    font-size: 15px;
  }
  .drift-panel { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; }
  .drift-panel .play {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    background: none;
    color: var(--brass);
    border: 1px solid var(--brass);
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
  }
  .drift-panel .play:hover { background: rgba(184, 137, 58, .15); }
  .drift-panel label { display: flex; align-items: center; gap: 10px; }
  .drift-panel input[type=range] { width: 130px; accent-color: var(--brass); }
  .drift-panel output { min-width: 3.2em; font-variant-numeric: tabular-nums; }

  .edit-panel { width: 230px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .edit-panel h2 { margin: 0; font-size: 18px; font-weight: normal; color: var(--brass); }
  .edit-panel p { margin: 0; line-height: 1.35; }
  .edit-panel .muted { opacity: .75; font-size: 14px; }

  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--fog); outline-offset: 2px; }

  .btn {
    background: none;
    color: var(--brass);
    border: 1px solid var(--brass);
    border-radius: 4px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  .btn:hover { background: rgba(184, 137, 58, .15); }
  .btn.primary { background: var(--brass); color: var(--ink); }
  .btn.danger { color: var(--rust); border-color: var(--rust); }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Popups */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--ink);
    color: var(--fog);
    border: 1px solid var(--brass);
  }
  .leaflet-popup-content { font-family: var(--font); font-size: 15px; margin: 12px 14px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--fog); }
  .popup-name { font-size: 18px; }
  .popup-note { margin: 6px 0 0; white-space: pre-wrap; }

  .place-form { display: flex; flex-direction: column; gap: 8px; }
  .place-form h3 { margin: 0; font-size: 17px; font-weight: normal; color: var(--brass); }
  .place-form label { display: flex; flex-direction: column; gap: 3px; }
  .place-form fieldset { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .place-form fieldset label { flex-direction: row; align-items: center; gap: 6px; }
  .place-form input[type=text], .place-form textarea {
    box-sizing: border-box;
    width: 100%;
    padding: 4px 6px;
    background: rgba(232, 236, 239, .08);
    color: var(--fog);
    border: 1px solid rgba(184, 137, 58, .6);
    border-radius: 3px;
    font: inherit;
  }
  .place-form input[type=radio] { accent-color: var(--brass); }

  .leaflet-control-layers {
    font-family: var(--font);
    font-size: 15px;
    background: rgba(26, 34, 41, .9) !important;
    color: var(--fog) !important;
    border: 1px solid var(--brass) !important;
  }
  .leaflet-control-layers input { accent-color: var(--brass); }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ==========================================================================
   CONFIG: everything you'd normally tweak lives here.
   All images should share the same pixel size (width x height below).
   Leave a src as null to use a generated placeholder.
   Place names and pins live in places.json (edit them with ?edit on the URL).
   ========================================================================== */
const CONFIG = {
  width: 2560,                 // px width of your images
  height: 1440,                // px height of your images

  baseMap: 'assets/World1-1.png',

  islands: {
    src: 'assets/World1-sky-islands.png',   // transparent, tiles left-to-right
    loopSeconds: 180,          // seconds for one full crossing at 1x speed
    direction: 1,              // 1 = enters from the right, -1 = enters from the left
    opacity: 1,
  },

  clouds: {
    src: null,                 // e.g. 'assets/clouds.png' (transparent, tiles left-to-right)
    loopSeconds: 90,
    direction: 1,
    opacity: 0.55,
  },

  placesFile: 'places.json',   // pins + island names; export a new one from edit mode

  startSpeed: 1,               // speed multiplier on load
  maxSpeed: 3,                 // top of the speed slider
  scrollWheelZoom: false,      // false plays nicer inside a Notion embed
};

/* ==========================================================================
   Placeholder art (only used when a src above is null)
   ========================================================================== */
const PLACEHOLDER_SPOTS = [
  { x: 420, y: 480 }, { x: 1150, y: 1080 }, { x: 1780, y: 420 }, { x: 2050, y: 1250 },
];

function seeded(seed) {
  return () => (seed = (seed * 16807) % 2147483647) / 2147483647;
}

function makeCanvas() {
  const c = document.createElement('canvas');
  c.width = CONFIG.width;
  c.height = CONFIG.height;
  return [c, c.getContext('2d')];
}

// Draws fn at x, x - width and x + width so shapes crossing an edge wrap seamlessly.
function drawWrapped(fn) {
  [-CONFIG.width, 0, CONFIG.width].forEach(fn);
}

function placeholderBase() {
  const [c, g] = makeCanvas();
  const grad = g.createRadialGradient(c.width / 2, c.height / 2, 100, c.width / 2, c.height / 2, c.width * 0.7);
  grad.addColorStop(0, '#2a5063');
  grad.addColorStop(1, '#16303d');
  g.fillStyle = grad;
  g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = 'rgba(232, 236, 239, .08)';
  g.lineWidth = 2;
  for (let x = 0; x <= c.width; x += 200) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, c.height); g.stroke(); }
  for (let y = 0; y <= c.height; y += 200) { g.beginPath(); g.moveTo(0, y); g.lineTo(c.width, y); g.stroke(); }
  return c.toDataURL();
}

function blobPath(g, cx, cy, radius, rand) {
  const harmonics = [1, 2, 3, 5].map(n => ({ n, amp: rand() * 0.18, phase: rand() * Math.PI * 2 }));
  g.beginPath();
  for (let i = 0; i <= 72; i++) {
    const a = (i / 72) * Math.PI * 2;
    const r = radius * (1 + harmonics.reduce((s, h) => s + h.amp * Math.sin(h.n * a + h.phase), 0));
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.75;
    i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.closePath();
}

function placeholderIslands() {
  const [c, g] = makeCanvas();
  const rand = seeded(7);
  PLACEHOLDER_SPOTS.forEach(({ x, y }) => {
    const radius = 90 + rand() * 80;
    const seed = Math.floor(rand() * 1e6) + 1;
    drawWrapped(dx => {
      blobPath(g, x + dx, y, radius * 1.25, seeded(seed));
      g.fillStyle = 'rgba(120, 190, 200, .35)'; g.fill();            // shallows
      blobPath(g, x + dx, y, radius, seeded(seed));
      g.fillStyle = '#d9c9a3'; g.fill();                            // sand
      blobPath(g, x + dx, y, radius * 0.8, seeded(seed));
      g.fillStyle = '#4f6b4a'; g.fill();                            // land
    });
  });
  return c.toDataURL();
}

function placeholderClouds() {
  const [c, g] = makeCanvas();
  const rand = seeded(42);
  for (let i = 0; i < 14; i++) {
    const cx = rand() * c.width, cy = rand() * c.height;
    const puffs = Array.from({ length: 6 }, () => ({
      ox: (rand() - 0.5) * 260, oy: (rand() - 0.5) * 70, r: 60 + rand() * 90,
    }));
    drawWrapped(dx => puffs.forEach(p => {
      const grad = g.createRadialGradient(cx + dx + p.ox, cy + p.oy, 0, cx + dx + p.ox, cy + p.oy, p.r);
      grad.addColorStop(0, 'rgba(255,255,255,.75)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grad;
      g.fillRect(cx + dx + p.ox - p.r, cy + p.oy - p.r, p.r * 2, p.r * 2);
    }));
  }
  return c.toDataURL();
}

/* ==========================================================================
   ScrollingLayer: an image overlay that scrolls its image in a seamless loop.
   It's clipped to its bounds, so nothing spills past the edge of the map.
   ========================================================================== */
const ScrollingLayer = L.ImageOverlay.extend({
  _initImage() {
    const el = this._image = L.DomUtil.create('div', 'leaflet-image-layer scroll-layer');
    if (this._zoomAnimated) L.DomUtil.addClass(el, 'leaflet-zoom-animated');
    this._strip = L.DomUtil.create('div', 'scroll-strip', el);
    for (let i = 0; i < 2; i++) {
      const img = L.DomUtil.create('img', '', this._strip);
      img.src = this._url;
      img.alt = '';
      img.draggable = false;
    }
    el.onselectstart = L.Util.falseFn;
    el.onmousemove = L.Util.falseFn;
  },
  // progress: 0..1, how far through one full loop
  setProgress(progress) {
    if (this._strip) this._strip.style.transform = `translate3d(${-progress * 50}%, 0, 0)`;
  },
});

/* ==========================================================================
   Helpers
   ========================================================================== */
const W = CONFIG.width, H = CONFIG.height;
const EDIT = new URLSearchParams(location.search).has('edit');
const DRAFT_KEY = 'drifting-isles:places-draft';

const wrap01 = v => ((v % 1) + 1) % 1;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const clampLatLng = ll => L.latLng(clamp(ll.lat, 0, H), clamp(ll.lng, 0, W));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ==========================================================================
   Map setup
   ========================================================================== */
const bounds = [[0, 0], [H, W]];

const map = L.map('map', {
  crs: L.CRS.Simple,
  zoomSnap: 0.25,
  scrollWheelZoom: CONFIG.scrollWheelZoom,
  attributionControl: false,
  maxBoundsViscosity: 0.8,
});

// Stack order: base map < islands < clouds < pins < island names
[['islands', 410], ['clouds', 420], ['pins', 440], ['labels', 450]].forEach(([name, z]) => {
  map.createPane(name).style.zIndex = z;
});

L.imageOverlay(CONFIG.baseMap || placeholderBase(), bounds).addTo(map);

const islands = new ScrollingLayer(CONFIG.islands.src || placeholderIslands(), bounds, {
  pane: 'islands', opacity: CONFIG.islands.opacity,
}).addTo(map);

const clouds = new ScrollingLayer(CONFIG.clouds.src || placeholderClouds(), bounds, {
  pane: 'clouds', opacity: CONFIG.clouds.opacity,
}).addTo(map);

const pinLayer = L.layerGroup().addTo(map);
const islandLabelLayer = L.layerGroup().addTo(map);

map.fitBounds(bounds);
map.setMinZoom(map.getZoom() - 0.5);
map.setMaxBounds(L.latLngBounds(bounds).pad(0.15));

L.control.layers(null, {
  'Drifting isles': islands,
  'Island names': islandLabelLayer,
  'Places': pinLayer,
  'Clouds': clouds,
}, { collapsed: true }).addTo(map);

const state = {
  speed: CONFIG.startSpeed,
  paused: EDIT || window.matchMedia('(prefers-reduced-motion: reduce)').matches,
  islands: 0,   // loop progress 0..1
  clouds: 0,
};

/* ==========================================================================
   Places: fixed pins + drifting island names
   Coordinates are image pixels from the top-left.
   Island name x is measured on the islands image, so it stays with its island.
   ========================================================================== */
let deployed = { pins: [], islandLabels: [] };   // what's in places.json
let places = { pins: [], islandLabels: [] };     // what's on screen (may be a draft)
let islandLabelEntries = [];
let draftStorageFailed = false;

const normalize = data => ({
  pins: Array.isArray(data?.pins) ? data.pins : [],
  islandLabels: Array.isArray(data?.islandLabels) ? data.islandLabels : [],
});

const pinIcon = name => L.divIcon({
  className: 'place-pin',
  html: `<span class="dot"></span><span class="name">${escapeHtml(name)}</span>`,
  iconSize: [14, 14],
  iconAnchor: [7, 7],
  popupAnchor: [0, -8],
});

const labelIcon = name => L.divIcon({
  className: 'island-label',
  html: `<span>${escapeHtml(name)}</span>`,
  iconSize: null,
});

function viewPopup(pin) {
  const el = document.createElement('div');
  const name = document.createElement('div');
  name.className = 'popup-name';
  name.textContent = pin.name;
  el.append(name);
  if (pin.note) {
    const note = document.createElement('p');
    note.className = 'popup-note';
    note.textContent = pin.note;
    el.append(note);
  }
  return el;
}

function renderPlaces() {
  map.closePopup();
  pinLayer.clearLayers();
  islandLabelLayer.clearLayers();
  islandLabelEntries = [];

  places.pins.forEach(pin => {
    const marker = L.marker([H - pin.y, pin.x], { pane: 'pins', draggable: EDIT, icon: pinIcon(pin.name) });
    if (EDIT) {
      marker.on('dragend', () => {
        const ll = clampLatLng(marker.getLatLng());
        pin.x = Math.round(ll.lng);
        pin.y = Math.round(H - ll.lat);
        commit();
      });
      marker.on('click', () => openEditPopup(marker, pin, 'pins'));
    } else {
      marker.bindPopup(() => viewPopup(pin));
    }
    marker.addTo(pinLayer);
  });

  places.islandLabels.forEach(label => {
    const marker = L.marker([H - label.y, label.x], {
      pane: 'labels', interactive: EDIT, draggable: EDIT, keyboard: false, icon: labelIcon(label.name),
    });
    const entry = { place: label, marker, dragging: false };
    if (EDIT) {
      marker.on('dragstart', () => { entry.dragging = true; });
      marker.on('dragend', () => {
        entry.dragging = false;
        const ll = clampLatLng(marker.getLatLng());
        label.x = Math.round(wrap01(ll.lng / W + state.islands) * W);   // convert screen spot -> islands image spot
        label.y = Math.round(H - ll.lat);
        commit();
      });
      marker.on('click', () => openEditPopup(marker, label, 'islandLabels'));
    }
    islandLabelEntries.push(entry);
    marker.addTo(islandLabelLayer);
  });
}

// Called after every edit: keep a draft only while it differs from places.json
function commit() {
  try {
    if (same(places, deployed)) localStorage.removeItem(DRAFT_KEY);
    else localStorage.setItem(DRAFT_KEY, JSON.stringify(places));
    draftStorageFailed = false;
  } catch {
    draftStorageFailed = true;
  }
  renderPlaces();
  editPanel?.update();
}

async function loadPlaces() {
  try {
    const res = await fetch(CONFIG.placesFile, { cache: 'no-store' });
    if (res.ok) deployed = normalize(await res.json());
    else console.warn(`${CONFIG.placesFile} returned ${res.status}; starting with no places.`);
  } catch (err) {
    console.warn(`Couldn't load ${CONFIG.placesFile}; starting with no places.`, err);
  }
  places = structuredClone(deployed);

  if (EDIT) {
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (raw) {
        const draft = normalize(JSON.parse(raw));
        if (same(draft, deployed)) localStorage.removeItem(DRAFT_KEY);
        else places = draft;
      }
    } catch { /* no draft available */ }
  }

  renderPlaces();
  editPanel?.update();
}

/* ==========================================================================
   Speed + pause control
   ========================================================================== */
const DriftControl = L.Control.extend({
  options: { position: 'bottomleft' },
  onAdd() {
    const panel = L.DomUtil.create('div', 'drift-panel');
    panel.innerHTML = `
      <button type="button" class="play" aria-label="Pause drift"></button>
      <label>Drift speed
        <input type="range" min="0" max="${CONFIG.maxSpeed}" step="0.05" value="${state.speed}">
        <output></output>
      </label>`;
    L.DomEvent.disableClickPropagation(panel);
    L.DomEvent.disableScrollPropagation(panel);

    const button = panel.querySelector('button');
    const slider = panel.querySelector('input');
    const readout = panel.querySelector('output');

    const render = () => {
      button.textContent = state.paused ? '▶' : '❚❚';
      button.setAttribute('aria-label', state.paused ? 'Resume drift' : 'Pause drift');
      readout.textContent = `${state.speed.toFixed(2)}×`;
    };
    button.addEventListener('click', () => { state.paused = !state.paused; render(); });
    slider.addEventListener('input', () => { state.speed = parseFloat(slider.value); render(); });
    document.addEventListener('keydown', e => {
      const tag = document.activeElement.tagName;
      if (e.code === 'Space' && !['INPUT', 'TEXTAREA', 'BUTTON'].includes(tag)) {
        e.preventDefault();
        button.click();
      }
    });
    render();
    return panel;
  },
});
new DriftControl().addTo(map);

/* ==========================================================================
   Edit mode (open the page with ?edit on the URL)
   ========================================================================== */
let editPanel = null;
let lastType = 'pin';

function placeForm({ heading, place, isPin, allowType, onSave, onDelete }) {
  const form = document.createElement('form');
  form.className = 'place-form';
  form.innerHTML = `
    <h3></h3>
    <label>Name <input type="text" name="name" required autocomplete="off"></label>
    ${allowType ? `
      <fieldset>
        <label><input type="radio" name="type" value="pin"> Fixed pin on the map</label>
        <label><input type="radio" name="type" value="island"> Island name (drifts)</label>
      </fieldset>` : ''}
    <label class="note-field">Note <textarea name="note" rows="3"></textarea></label>
    <div class="row">
      <button type="submit" class="btn primary">Save</button>
      ${onDelete ? '<button type="button" class="btn danger" data-delete>Delete</button>' : ''}
    </div>`;

  form.querySelector('h3').textContent = heading;
  form.elements.name.value = place.name || '';
  form.elements.note.value = place.note || '';

  const noteField = form.querySelector('.note-field');
  const currentType = () => (allowType ? form.elements.type.value : (isPin ? 'pin' : 'island'));
  const syncNote = () => { noteField.hidden = currentType() !== 'pin'; };
  if (allowType) {
    form.elements.type.value = lastType;
    form.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', syncNote));
  }
  syncNote();

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = form.elements.name.value.trim();
    if (!name) return;
    onSave({ name, note: form.elements.note.value.trim(), type: currentType() });
  });
  form.querySelector('[data-delete]')?.addEventListener('click', onDelete);
  L.DomEvent.disableClickPropagation(form);
  return form;
}

function openPopup(latlng, form) {
  L.popup({ minWidth: 220, maxWidth: 260 }).setLatLng(latlng).setContent(form).openOn(map);
  setTimeout(() => form.elements.name.focus(), 0);
}

function openAddPopup(latlng) {
  // Capture where this spot is on the islands image right now, in case the drift is running
  const islandX = wrap01(latlng.lng / W + state.islands) * W;
  const y = Math.round(H - latlng.lat);

  openPopup(latlng, placeForm({
    heading: 'New place',
    place: {},
    allowType: true,
    onSave: ({ name, note, type }) => {
      lastType = type;
      if (type === 'island') places.islandLabels.push({ id: newId(), name, x: Math.round(islandX), y });
      else places.pins.push({ id: newId(), name, x: Math.round(latlng.lng), y, note });
      commit();
    },
  }));
}

function openEditPopup(marker, place, listKey) {
  const isPin = listKey === 'pins';
  openPopup(marker.getLatLng(), placeForm({
    heading: isPin ? 'Edit pin' : 'Edit island name',
    place,
    isPin,
    allowType: false,
    onSave: ({ name, note }) => {
      place.name = name;
      if (isPin) place.note = note;
      commit();
    },
    onDelete: () => {
      if (!confirm(`Delete "${place.name}"?`)) return;
      places[listKey] = places[listKey].filter(p => p !== place);
      commit();
    },
  }));
}

if (EDIT) {
  map.getContainer().classList.add('editing');

  // A click that only closes an open popup shouldn't also start a new place
  let lastPopupClose = 0;
  map.on('popupclose', () => { lastPopupClose = performance.now(); });
  map.on('click', e => {
    if (performance.now() - lastPopupClose < 300) return;
    const { lat, lng } = e.latlng;
    if (lat < 0 || lat > H || lng < 0 || lng > W) return;
    openAddPopup(e.latlng);
  });

  const EditControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const panel = L.DomUtil.create('div', 'edit-panel');
      panel.innerHTML = `
        <h2>Editing places</h2>
        <p class="muted">Click the map to add a place. Drag one to move it, or click it to rename or delete.</p>
        <p data-count></p>
        <p class="muted" data-status role="status"></p>
        <div class="row">
          <button type="button" class="btn primary" data-export>Export places.json</button>
          <button type="button" class="btn" data-copy>Copy JSON</button>
        </div>
        <div class="row"><button type="button" class="btn danger" data-discard>Discard draft</button></div>`;
      L.DomEvent.disableClickPropagation(panel);
      L.DomEvent.disableScrollPropagation(panel);

      const json = () => JSON.stringify(places, null, 2) + '\n';
      const copyBtn = panel.querySelector('[data-copy]');
      const discardBtn = panel.querySelector('[data-discard]');

      panel.querySelector('[data-export]').addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([json()], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = 'places.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(json());
          copyBtn.textContent = 'Copied';
        } catch {
          copyBtn.textContent = 'Copy blocked';
        }
        setTimeout(() => { copyBtn.textContent = 'Copy JSON'; }, 1500);
      });

      discardBtn.addEventListener('click', () => {
        if (!confirm('Discard your draft and go back to the deployed places.json?')) return;
        places = structuredClone(deployed);
        commit();
      });

      this.update = () => {
        const p = places.pins.length, l = places.islandLabels.length;
        panel.querySelector('[data-count]').textContent =
          `${p} ${p === 1 ? 'pin' : 'pins'}, ${l} island ${l === 1 ? 'name' : 'names'}`;
        const isDraft = !same(places, deployed);
        panel.querySelector('[data-status]').textContent = draftStorageFailed
          ? "This browser won't keep a draft here. Export before closing the page."
          : isDraft
            ? 'Draft saved in this browser. Export and redeploy to publish it.'
            : 'Matches the deployed places.json.';
        discardBtn.disabled = !isDraft;
      };
      return panel;
    },
  });
  editPanel = new EditControl().addTo(map);
}

/* ==========================================================================
   Animation loop (time-based, so speed is the same at any frame rate)
   ========================================================================== */
const EDGE_FADE = 0.03; // island names fade out within this fraction of the map edge

let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  if (!state.paused && state.speed > 0) {
    state.islands = wrap01(state.islands + CONFIG.islands.direction * state.speed * dt / CONFIG.islands.loopSeconds);
    state.clouds  = wrap01(state.clouds  + CONFIG.clouds.direction  * state.speed * dt / CONFIG.clouds.loopSeconds);
  }

  islands.setProgress(state.islands);
  clouds.setProgress(state.clouds);

  islandLabelEntries.forEach(({ place, marker, dragging }) => {
    if (dragging) return;
    const nx = wrap01(place.x / W - state.islands);     // current position, 0..1 across the map
    marker.setLatLng([H - place.y, nx * W]);
    const fade = Math.min(1, Math.min(nx, 1 - nx) / EDGE_FADE);
    marker.setOpacity(EDIT ? Math.max(0.4, fade) : fade);
  });

  requestAnimationFrame(tick);
}

loadPlaces();
requestAnimationFrame(tick);
</script>
</body>
