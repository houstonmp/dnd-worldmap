<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&amp;D - World Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --ink: #1a2229;
    --sea: #1e3a4a;
    --brass: #b8893a;
    --fog: #e8ecef;
    --kelp: #4f6b4a;
    --rust: #e08a7a;
    --beacon: #e4572e;
    --font: 'IM Fell English', Georgia, 'Times New Roman', serif;
  }
  [hidden] { display: none !important; }

  /* Netlify's badge/drawer iframe: hidden by default */
  #nl-badge-frame { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--ink); }
  #map { height: 100%; background: var(--ink); font-family: var(--font); }

  /* Scrolling layers: a clipped box holding a 200%-wide strip of two copies */
  .scroll-layer { overflow: hidden; pointer-events: none; }
  .scroll-strip { display: flex; width: 200%; height: 100%; will-change: transform; }
  .scroll-strip img { display: block; width: 50%; height: 100%; max-width: none; user-select: none; }

  /* Shared text halo so names read on any background */
  .island-label span, .place-pin .name {
    white-space: nowrap;
    font-family: var(--font);
    color: var(--ink);
    text-shadow: 0 0 3px var(--fog), 0 0 6px var(--fog), 0 0 10px rgba(232, 236, 239, .8);
  }

  /* Island names (drift with the islands) */
  .island-label { background: none; border: none; }
  .island-label span {
    display: inline-block;
    transform: translate(-50%, -50%);
    font-style: italic;
    font-size: 17px;
  }

  /* Fixed pins (stay put on the base map). Size and color come from PLACE_TYPES in index.js */
  .place-pin { background: none; border: none; }
  .place-pin .dot {
    position: absolute; left: 3px; top: 3px;
    border: 1px solid var(--ink);
    transform: rotate(45deg);
  }
  .place-pin .name { position: absolute; top: 50%; transform: translateY(-50%); }

  /* Places that need attention in the editor (players never receive these) */
  .place-pin.is-flagged .dot { opacity: .6; border-style: dashed; }
  .place-pin.is-flagged .name, .island-label.is-flagged span { opacity: .7; }
  .place-pin .name[data-tag]::after, .island-label span[data-tag]::after {
    content: ' · ' attr(data-tag);
    font-size: 11px;
    font-style: normal;
  }
  .island-label.has-link span { cursor: pointer; }

  /* Map search (top center) and the go-to-party button */
  .map-search {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    width: min(380px, calc(100% - 150px));
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-family: var(--font);
    font-size: 15px;
    color: var(--fog);
  }
  .map-search .combo { position: relative; flex: 1; min-width: 0; }
  .map-search .combo-input {
    box-sizing: border-box;
    width: 100%;
    height: 36px;
    padding: 0 10px;
    background: rgba(26, 34, 41, .92);
    color: var(--fog);
    border: 1px solid var(--brass);
    border-radius: 6px;
    font: inherit;
  }
  .map-search .combo-input::placeholder { color: rgba(232, 236, 239, .55); }
  .map-search .combo-list {
    position: absolute;
    top: 100%; left: 0; right: 0;
    margin-top: 4px;
    max-height: min(320px, 60vh);
    border-color: var(--brass);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
  }
  .party-btn {
    flex: none;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    padding: 0;
    background: rgba(26, 34, 41, .92);
    color: var(--beacon);
    border: 1px solid var(--brass);
    border-radius: 6px;
    cursor: pointer;
  }
  .party-btn:hover { background: rgba(60, 50, 40, .95); }
  .map-search input:focus-visible, .party-btn:focus-visible { outline: 2px solid var(--fog); outline-offset: 2px; }

  /* Bottom-left column: the places-within panel sits on top of the drift controls.
     Both stretch to the same width (the drift bar's), so their edges line up. */
  .leaflet-bottom.leaflet-left { display: flex; flex-direction: column; align-items: stretch; }
  .leaflet-bottom.leaflet-left .leaflet-control { float: none; clear: none; }

  .sub-panel {
    position: relative;
    box-sizing: border-box;
    contain: inline-size;         /* take the column's width without widening it */
    max-height: min(40vh, 320px);
    overflow-y: auto;
    padding: 10px 12px;
    background: rgba(26, 34, 41, .94);
    color: var(--fog);
    border: 1px solid var(--brass);
    border-radius: 6px;
    font-family: var(--font);
    font-size: 15px;
  }
  .sub-close {
    position: absolute; top: 4px; right: 4px;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    padding: 0;
    background: none;
    color: var(--fog);
    border: none;
    border-radius: 4px;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
  }
  .sub-close:hover { background: rgba(184, 137, 58, .2); }
  .sub-close:focus-visible { outline: 2px solid var(--fog); outline-offset: 1px; }
  .sub-heading { margin: 0 26px 6px 0; font-weight: normal; display: flex; flex-direction: column; }
  .sub-heading-label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--brass); }
  .sub-heading-parent { font-size: 17px; overflow-wrap: anywhere; }
  .sub-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .sub-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    padding: 5px 8px;
    border-radius: 4px;
    color: var(--fog);
    text-decoration: none;
  }
  .leaflet-container a.sub-row { color: var(--fog); }
  .leaflet-container a.sub-row:hover { background: rgba(184, 137, 58, .15); }
  .leaflet-container a.sub-row::after { content: '↗'; flex: none; color: var(--brass); font-size: 13px; }
  .sub-list .is-highlight .sub-row { background: rgba(184, 137, 58, .28); }
  .sub-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .sub-pron { flex: none; font-size: 13px; font-style: italic; opacity: .7; }

  /* DM view: Session panel (above the drift bar) and initiative tracker (bottom right) */
  .dm-panel, .init-tracker {
    box-sizing: border-box;
    background: rgba(26, 34, 41, .94);
    color: var(--fog);
    border: 1px solid var(--brass);
    border-radius: 6px;
    font-family: var(--font);
    font-size: 15px;
  }
  .dm-panel {
    contain: inline-size;         /* same width as the drift bar, without widening the column */
    max-height: min(36vh, 300px);
    overflow-y: auto;
    padding: 8px 10px;
  }
  .dm-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dm-title { margin: 0; font-size: 13px; font-weight: normal; letter-spacing: .06em; text-transform: uppercase; color: var(--brass); display: flex; align-items: baseline; gap: 8px; }
  .dm-tools { display: flex; align-items: center; gap: 4px; }
  .icon-btn.text-btn { width: auto; padding: 0 8px; font-size: 13px; color: var(--brass); }
  .dm-links { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .dm-link-row { display: flex; align-items: center; gap: 2px; }
  .leaflet-container a.session-link {
    flex: 1; display: flex; align-items: baseline; gap: 6px;
    padding: 4px 6px;
    border-radius: 4px;
    color: var(--fog);
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .leaflet-container a.session-link:hover { background: rgba(184, 137, 58, .15); }
  .leaflet-container a.session-link::after { content: '↗'; margin-left: auto; color: var(--brass); font-size: 13px; }
  .dm-link-row.is-current a.session-link { background: rgba(184, 137, 58, .14); }
  .dm-current-tag { flex: none; padding: 0 6px; border-radius: 999px; background: var(--brass); color: var(--ink); font-size: 11px; line-height: 17px; }
  .dm-link-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
  .dm-empty { margin: 6px 0 2px; font-size: 13px; opacity: .7; line-height: 1.35; }
  .dm-add { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .dm-add input, .init-input, .init-notes, .init-select {
    box-sizing: border-box;
    width: 100%;
    padding: 3px 6px;
    background: rgba(232, 236, 239, .08);
    color: var(--fog);
    border: 1px solid rgba(184, 137, 58, .5);
    border-radius: 3px;
    font: inherit;
    font-size: 14px;
  }
  .init-select option { background: var(--ink); }
  .dm-status { font-size: 12px; opacity: .65; }
  .dm-status.is-unsaved { color: #e6c35c; opacity: 1; }
  .dm-status.is-problem { color: var(--rust); opacity: 1; }
  .dm-save-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .dm-save-row .dm-status { margin-right: auto; }
  .dm-save { padding: 2px 10px; font-size: 13px; }
  .init-save { margin: 0 0 0 auto; }

  .init-tracker { width: min(470px, calc(100vw - 20px)); max-height: min(70vh, 560px); overflow-y: auto; padding: 8px 10px; }
  .init-tracker.is-min { width: auto; padding: 0; border: none; background: none; }
  .init-open { background: rgba(26, 34, 41, .94); padding: 6px 12px; }
  .init-round { font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--fog); opacity: .75; }
  .init-tracker .dm-tools .btn { padding: 2px 8px; font-size: 13px; }
  .init-table { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
  .init-row { display: grid; grid-template-columns: 12px 22px 40px minmax(0, 1fr) 42px 42px 36px 16px 22px 22px 22px; align-items: center; gap: 4px; }
  .init-cols { font-size: 11px; opacity: .6; padding-bottom: 2px; }
  .init-row.is-turn { background: rgba(184, 137, 58, .18); border-radius: 4px; }
  /* Health bands (need Max HP, except down at 0) */
  .init-row.hp-healthy  .init-input[aria-label^="Current HP"] { color: #9fd8a8; border-color: #5f9a68; background: rgba(95, 154, 104, .18); }
  .init-row.hp-bloodied .init-input[aria-label^="Current HP"] { color: #f0cf72; border-color: #c49a2c; background: rgba(196, 154, 44, .2); }
  .init-row.hp-critical .init-input[aria-label^="Current HP"] { color: #ff9b8a; border-color: #d0564a; background: rgba(208, 86, 74, .28); }
  .init-row.hp-critical .init-name { border-color: #d0564a; }
  .init-row.hp-down .init-name { text-decoration: line-through; opacity: .55; }
  .init-row.hp-down .init-input[aria-label^="Current HP"] { color: rgba(232, 236, 239, .5); border-style: dashed; }
  .init-move { display: flex; flex-direction: column; gap: 1px; }
  .move-btn {
    width: 18px; height: 12px; padding: 0;
    display: grid; place-items: center;
    background: none; color: var(--fog);
    border: none; border-radius: 2px;
    font-size: 8px; line-height: 1; cursor: pointer; opacity: .7;
  }
  .move-btn:hover:not(:disabled) { background: rgba(184, 137, 58, .3); opacity: 1; }
  .move-btn:disabled { opacity: .15; cursor: default; }
  .move-btn:focus-visible { outline: 2px solid var(--fog); outline-offset: 0; }
  .hp-adjust { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(184, 137, 58, .35); }
  .hp-pills { display: flex; flex-wrap: wrap; gap: 4px; max-height: 140px; overflow-y: auto; padding: 1px; }
  .hp-pill {
    display: inline-flex; align-items: baseline; gap: 5px;
    max-width: 100%;
    padding: 2px 9px;
    background: rgba(232, 236, 239, .06);
    color: var(--fog);
    border: 1px solid rgba(184, 137, 58, .45);
    border-radius: 999px;
    font: inherit; font-size: 13px;
    cursor: pointer;
  }
  .hp-pill:hover { background: rgba(184, 137, 58, .15); }
  .hp-pill[aria-pressed=true] { background: var(--brass); color: var(--ink); border-color: var(--brass); }
  .hp-pill-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
  .hp-pill-hp { font-size: 11px; opacity: .8; font-variant-numeric: tabular-nums; }
  .hp-pill.hp-healthy  .hp-pill-hp { color: #9fd8a8; }
  .hp-pill.hp-bloodied .hp-pill-hp { color: #f0cf72; }
  .hp-pill.hp-critical { border-color: #d0564a; }
  .hp-pill.hp-critical .hp-pill-hp { color: #ff9b8a; }
  .hp-pill.hp-down { opacity: .55; }
  .hp-pill.hp-down .hp-pill-name { text-decoration: line-through; }
  .hp-pill[aria-pressed=true] .hp-pill-hp { color: var(--ink); opacity: .75; }
  .hp-pill:focus-visible { outline: 2px solid var(--fog); outline-offset: 1px; }
  .hp-controls { display: grid; grid-template-columns: minmax(56px, 1fr) auto auto; gap: 4px; }
  .hp-amount { text-align: center; -moz-appearance: textfield; }
  .hp-amount::-webkit-outer-spin-button, .hp-amount::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .btn.heal { color: #9fd8a8; border-color: #5f9a68; }
  .btn.heal:hover { background: rgba(95, 154, 104, .18); }
  .turn-mark { color: var(--brass); font-size: 11px; text-align: center; }
  .init-input { padding: 3px 4px; text-align: center; }
  .init-input.init-name { text-align: left; }
  .icon-btn.has-notes { color: var(--brass); }
  .init-notes { margin: 0 0 4px 18px; width: calc(100% - 18px); resize: vertical; }
  .init-add { margin-top: 6px; width: 100%; }
  .init-add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; margin-top: 8px; align-items: start; }
  .init-add-row .combo-list { max-height: 220px; }
  .init-add-row .combo-input { text-align: left; padding: 4px 8px; }
  .add-note { margin: 4px 0 0; color: var(--rust); font-size: 12px; }
  .icon-btn.has-statblock { color: #c9a0dc; }

  /* Bestiary stat block (inside an expanded tracker row) */
  .statblock-holder {
    margin: 0 0 4px 18px;
    padding: 8px 10px;
    max-height: 300px;
    overflow-y: auto;
    background: rgba(232, 236, 239, .05);
    border: 1px solid rgba(184, 137, 58, .35);
    border-left: 3px solid #8e2f3f;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.4;
  }
  .statblock { color: var(--fog); }
  .sb-name { margin: 0; font-size: 17px; font-weight: normal; color: #e07b6c; letter-spacing: .02em; }
  .sb-meta { font-style: italic; opacity: .8; margin-bottom: 4px; }
  .sb-section { padding: 4px 0; border-top: 1px solid rgba(224, 123, 108, .35); }
  .sb-line, .sb-desc { margin: 2px 0; }
  .sb-desc { white-space: pre-line; }
  .sb-line strong, .sb-item { color: #e8c2bb; }
  .sb-item { font-style: italic; }
  .sb-heading { margin: 4px 0 2px; font-size: 14px; font-weight: normal; color: #e07b6c; border-bottom: 1px solid rgba(224, 123, 108, .35); }
  .sb-abilities { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; padding: 4px 0; border-top: 1px solid rgba(224, 123, 108, .35); text-align: center; }
  .sb-ab-name { display: block; font-weight: bold; font-size: 11px; color: #e8c2bb; }
  .sb-ab-score { font-size: 12px; white-space: nowrap; }
  .sb-source { margin: 6px 0 0; font-size: 11px; opacity: .55; }
  .is-large .statblock-holder { margin-left: 30px; max-height: none; font-size: 17px; padding: 12px 16px; }
  .is-large .sb-name { font-size: 24px; }
  .is-large .sb-heading { font-size: 19px; }
  .is-large .sb-ab-name { font-size: 14px; }
  .is-large .sb-ab-score { font-size: 16px; }
  .is-large .init-add-row { gap: 8px; margin-top: 12px; }
  .is-large .init-add-row .combo-input { font-size: 19px; padding: 6px 10px; }
  .is-large .init-add-row .combo-option { font-size: 17px; padding: 6px 10px; }
  .init-encounters { display: grid; grid-template-columns: 1fr auto auto; gap: 4px; margin-top: 8px; }
  .init-foot { display: flex; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .init-tracker .btn { font-size: 13px; padding: 3px 8px; }

  /* Bestiary menu */
  .bestiary-modal {
    width: min(1100px, calc(100vw - 32px));
    height: min(820px, calc(100vh - 48px));
    padding: 0;
    background: var(--ink);
    color: var(--fog);
    border: 1px solid var(--brass);
    border-radius: 8px;
    font-family: var(--font);
    font-size: 16px;
  }
  .bestiary-modal::backdrop { background: rgba(10, 14, 18, .65); }
  .bst { display: flex; flex-direction: column; height: 100%; }
  .bst-head, .bst-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; }
  .bst-head { border-bottom: 1px solid rgba(184, 137, 58, .35); }
  .bst-head h2 { margin: 0; font-size: 22px; font-weight: normal; color: var(--brass); }
  .bst-head-tools { display: flex; gap: 6px; }
  .bst-foot { border-top: 1px solid rgba(184, 137, 58, .35); }
  .bst-foot .dm-save-row { margin: 0; width: 100%; }
  .bst-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr); }
  .bst-side { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-right: 1px solid rgba(184, 137, 58, .25); min-height: 0; }
  .bst-filter, .bst-import .combo-input {
    box-sizing: border-box; width: 100%; padding: 6px 8px;
    background: rgba(232, 236, 239, .08); color: var(--fog);
    border: 1px solid rgba(184, 137, 58, .55); border-radius: 4px; font: inherit; font-size: 15px;
  }
  .bst-list { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 80px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .bst-item {
    width: 100%; display: flex; align-items: baseline; gap: 6px;
    padding: 6px 8px; text-align: left;
    background: none; color: var(--fog);
    border: 1px solid transparent; border-radius: 4px;
    font: inherit; font-size: 15px; cursor: pointer;
  }
  .bst-item:hover { background: rgba(184, 137, 58, .12); }
  .bst-item[aria-pressed=true] { background: rgba(184, 137, 58, .25); border-color: var(--brass); }
  .bst-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bst-item-cr { flex: none; font-size: 12px; opacity: .7; }
  .bst-item-linked { flex: none; font-size: 12px; }
  .bst-body.has-search { grid-template-columns: 260px minmax(0, 1fr) 360px; }
  .bst-search { display: flex; flex-direction: column; gap: 8px; padding: 12px; min-height: 0; border-left: 1px solid var(--brass); background: rgba(232, 236, 239, .03); }
  .bst-search[hidden] { display: none; }
  .bst-search-head { display: flex; align-items: center; justify-content: space-between; }
  .bst-search-head h3 { margin: 0; font-size: 16px; font-weight: normal; letter-spacing: .05em; text-transform: uppercase; color: var(--brass); }
  .bst-search-status { margin: 0; font-size: 13px; opacity: .7; }
  .bst-results { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .bst-result {
    width: 100%; display: grid; grid-template-columns: 1fr; gap: 1px;
    padding: 7px 9px; text-align: left;
    background: rgba(232, 236, 239, .04); color: var(--fog);
    border: 1px solid rgba(184, 137, 58, .25); border-radius: 5px;
    font: inherit; cursor: pointer;
  }
  .bst-result:hover, .bst-result:focus-visible { background: rgba(184, 137, 58, .18); border-color: var(--brass); outline: none; }
  .bst-result-name { font-size: 16px; }
  .bst-result-meta { font-size: 13px; opacity: .8; }
  .bst-result-source { font-size: 12px; opacity: .55; font-style: italic; }
  .bst-more { width: 100%; margin-top: 4px; }
  .bst-results-head { margin: 6px 0 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--brass); }
  .bst-results-head:first-child { margin-top: 0; }
  .bst-preset-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; align-items: stretch; }
  .bst-result.is-preset { border-left: 3px solid #9fd8a8; }
  .bst-result.is-preset .bst-result-source { color: #9fd8a8; opacity: .8; }
  .bst-preset-del { align-self: center; }
  .bst-results-note { font-size: 13px; opacity: .7; }
  .bst-search-status:empty { display: none; }
  /* With the search panel open the editor column is narrower: keep the top bar on one line */
  .bst-body.has-search .bst-editor-top .btn { padding: 3px 8px; font-size: 14px; }
  .bst-body.has-search .bst-source { display: none; }
  .bst-editor-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: -14px; z-index: 1; margin: -14px -18px 0; padding: 12px 18px; background: var(--ink); border-bottom: 1px solid rgba(184, 137, 58, .25); }
  .bst-done { margin-left: auto; }
  .bst-view-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bst-view-name { margin: 0; font-size: 24px; font-weight: normal; }
  .bst-add-row { display: flex; align-items: center; gap: 8px; }
  .bst-group { margin: 0; padding: 10px 12px 12px; border: 1px solid rgba(184, 137, 58, .3); border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
  .bst-group legend { padding: 0 6px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--brass); }
  .bst-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 10px; }
  .bst-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bst-grid .span2 { grid-column: span 2; }
  .bst-abilities { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .bst-abilities .init-input { text-align: center; }
  .bst-field .init-input { text-align: left; font-size: 15px; padding: 5px 8px; }
  .bst-abilities .bst-field .init-input { text-align: center; }
  .bst-hint-line { font-size: 13px; opacity: .65; font-style: italic; }
  .bst-entry { display: flex; flex-direction: column; gap: 4px; padding: 8px; background: rgba(232, 236, 239, .04); border: 1px solid rgba(184, 137, 58, .2); border-radius: 5px; }
  .bst-entry-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
  .bst-entry-name { text-align: left; font-size: 15px; font-style: italic; padding: 4px 8px; }
  .bst-entry-tools { display: flex; gap: 2px; }
  .bst-desc { margin: 0; width: 100%; font-size: 14px; resize: vertical; }
  .bst-main.is-editing { gap: 14px; }
  @media (max-width: 760px) {
    .bst-grid, .bst-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bst-abilities { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  .bst-source { font-size: 13px; opacity: .65; font-style: italic; }
  .bst-hint { margin: 2px 0 0; font-size: 13px; color: #e6c35c; line-height: 1.4; }
  .bst-import { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px dashed rgba(184, 137, 58, .35); }
  .bst-import label, .bst-label { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--brass); }
  .bst-import .combo-list { max-height: 260px; }
  .bst-import-note { margin: 0; font-size: 13px; opacity: .8; }
  .bst-main { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .bst-empty { opacity: .7; margin: 30px auto; text-align: center; max-width: 360px; line-height: 1.5; }
  .bst-form { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px 10px; }
  .bst-field { display: flex; flex-direction: column; gap: 3px; }
  .bst-field.wide { grid-column: 1 / -1; }
  .bst-form .bst-field:nth-child(1) { grid-column: span 4; }
  .bst-form .bst-field:nth-child(2) { grid-column: span 2; }
  .bst-form .bst-field:nth-child(n+3) { grid-column: span 1; }
  .bst-form .bst-field:nth-child(5) { grid-column: span 2; }
  .bst-form .bst-field:nth-child(6) { grid-column: span 1; }
  .bst-field .init-input, .bst-notion .init-input { text-align: left; font-size: 15px; padding: 5px 8px; }
  .bst-notion { display: flex; flex-direction: column; gap: 4px; }
  .bst-notes { margin: 0; width: 100%; font-size: 15px; }
  .bst-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bst-count { width: 64px; text-align: center; }
  .bst-added { font-size: 13px; color: #9fd8a8; }
  .bst-block { margin: 0; max-height: none; font-size: 15px; }
  .sb-links { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid rgba(224, 123, 108, .35); }
  /* Narrower screens: the search panel slides over the editor instead of adding a column */
  @media (max-width: 1000px) {
    .bst-body.has-search { grid-template-columns: 240px minmax(0, 1fr); position: relative; }
    .bst-search { position: absolute; top: 0; right: 0; bottom: 0; width: min(360px, 90%); z-index: 2; box-shadow: -8px 0 24px rgba(0, 0, 0, .45); background: var(--ink); }
  }
  @media (max-width: 760px) {
    .bestiary-modal { height: calc(100vh - 24px); }
    .bst-body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .bst-side { border-right: none; border-bottom: 1px solid rgba(184, 137, 58, .25); max-height: 40vh; }
    .bst-form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bst-form .bst-field:nth-child(n) { grid-column: span 1; }
    .bst-form .bst-field:nth-child(1) { grid-column: 1 / -1; }
  }

  /* Large initiative view: the bestiary search sits at the top */
  .init-search { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 12px; align-items: start; }
  .init-search .combo-input { text-align: left; font-size: 18px; padding: 6px 10px; }
  /* Results float over the list (pushing it down would make rows jump when the list closes mid-click) */
  .init-search .combo { position: relative; }
  .init-search .combo-list {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 5;
    max-height: 300px; margin-top: 4px;
    border-color: var(--brass);
    box-shadow: 0 8px 22px rgba(0, 0, 0, .45);
  }
  .init-search .combo-option { font-size: 16px; padding: 6px 10px; }

  /* Spell cards (styled after printed spell cards) */
  .spell-card {
    --school: #b8893a;
    max-width: 560px;
    display: flex; flex-direction: column;
    background: #f4ecd8; color: #2a2118;
    border: 3px solid var(--school); border-radius: 10px;
    overflow: hidden;
    font-family: var(--font);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
  }
  .school-abjuration { --school: #3f7ab0; }
  .school-conjuration { --school: #b07a2e; }
  .school-divination { --school: #6f8fa3; }
  .school-enchantment { --school: #b0487a; }
  .school-evocation { --school: #b8402e; }
  .school-illusion { --school: #7a55a8; }
  .school-necromancy { --school: #4d5a3a; }
  .school-transmutation { --school: #3b8a6a; }
  .sc-head { padding: 8px 12px 6px; background: var(--school); color: #fff; }
  .sc-name { margin: 0; font-size: 22px; font-weight: normal; letter-spacing: .02em; }
  .sc-type { font-size: 14px; font-style: italic; opacity: .92; }
  .sc-stats { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 2px solid var(--school); }
  .sc-stat { display: flex; flex-direction: column; padding: 5px 10px; text-align: center; border-top: 1px solid rgba(0, 0, 0, .12); }
  .sc-stat:nth-child(odd) { border-right: 1px solid rgba(0, 0, 0, .12); }
  .sc-k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--school); font-weight: bold; }
  .sc-v { font-size: 15px; }
  .sc-flags { display: flex; gap: 6px; padding: 6px 12px 0; }
  .sc-flags .tag { color: var(--school); border-color: var(--school); background: none; }
  .sc-material { margin: 6px 12px 0; font-size: 13px; font-style: italic; opacity: .8; }
  .sc-desc { padding: 8px 12px; font-size: 15px; line-height: 1.45; white-space: pre-line; }
  .sc-higher, .sc-notes { margin: 0 12px 8px; padding-top: 6px; border-top: 1px solid rgba(0, 0, 0, .15); font-size: 14px; line-height: 1.4; white-space: pre-line; }
  .sc-higher strong, .sc-notes strong { color: var(--school); font-style: italic; }
  .sc-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: auto; padding: 5px 12px; background: rgba(0, 0, 0, .06); font-size: 12px; font-style: italic; opacity: .85; }
  .bst-flags { display: flex; gap: 18px; }
  .spl-preview .spell-card { max-width: none; }
  .bst-result.is-added { border-color: #9fd8a8; }
  .spellbook-modal select.bst-filter { cursor: pointer; }

  /* Native menus (select dropdowns) follow the dark theme instead of the browser's white default */
  .bestiary-modal, .init-modal, .spell-popup, .init-tracker, .dm-panel { color-scheme: dark; }
  .bestiary-modal select, .init-tracker select, .dm-panel select { background-color: #232c33; color: var(--fog); }
  .bestiary-modal select option, .init-tracker select option, .dm-panel select option { background-color: #1a2229; color: var(--fog); }

  /* Spellbook filters */
  .spl-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .spl-filters select { min-width: 0; font-size: 13px; padding: 4px 6px; }
  .spl-status { margin: 0; font-size: 12px; opacity: .7; }
  .spl-mine { color: #c9a0dc; border-color: #c9a0dc; }
  .spl-actions { display: flex; gap: 6px; }
  .spl-card-holder { display: flex; }
  .spl-aliases { margin-bottom: 4px; }
  .spl-via { font-size: 12px; font-style: italic; opacity: .7; }
  .sc-aka { font-size: 13px; font-style: italic; opacity: .85; margin-top: 2px; }

  /* Spells in stat blocks */
  .sb-spell-level { margin: 2px 0; line-height: 1.6; }
  .spell-chip {
    padding: 0; background: none; border: none;
    color: #c9a0dc; font: inherit; font-style: italic; cursor: pointer;
    text-decoration: underline; text-decoration-color: rgba(201, 160, 220, .4); text-underline-offset: 3px;
  }
  .spell-chip.is-prepared { font-weight: bold; }
  .spell-chip:hover, .spell-chip:focus-visible { color: #e8cdf2; text-decoration-color: currentColor; outline: none; }
  .spell-note { font-size: .9em; opacity: .7; }

  /* Spell picker in the Bestiary editor */
  .spl-pick .combo-list { max-height: 260px; }
  .spl-pick .combo-input { text-align: left; }
  .spl-pick-rows { display: flex; flex-direction: column; gap: 4px; }
  .spl-pick-row { display: grid; grid-template-columns: minmax(0, 1fr) 54px auto minmax(0, 150px) 26px 26px; gap: 8px; align-items: center; }
  .spl-pick-row.is-unlinked { padding: 3px 6px; margin: 0 -6px; background: rgba(230, 195, 92, .08); border-radius: 4px; }
  .spl-pick-row.is-relinking { grid-template-columns: minmax(0, 1fr) auto; }
  .spl-link-actions { grid-column: span 3; display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .spl-link-actions .btn { padding: 2px 10px; font-size: 13px; }
  .spl-unlinked-name { color: #e6c35c; cursor: default; }
  .spl-unlinked-name:hover { text-decoration: none; }
  .spl-unlinked-tag { font-size: 12px; font-style: italic; color: #e6c35c; opacity: .85; }
  .spl-relink-btn { font-size: 12px; opacity: .7; }
  .spl-relink-btn:hover { opacity: 1; }
  .spl-relink .combo-input { text-align: left; }
  .spell-chip.is-unlinked { color: #e6c35c; text-decoration: underline dotted; cursor: help; font-weight: normal; }
  .spl-pick-open { padding: 0; background: none; border: none; color: #c9a0dc; font: inherit; text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spl-pick-open:hover { text-decoration: underline; }
  .spl-pick-level { font-size: 12px; opacity: .7; text-align: center; }
  .spl-prep { font-size: 13px; }
  .spl-note { font-size: 13px; padding: 3px 6px; text-align: left; }

  /* Preview card for presets and Open5e creatures (before applying) */
  .creature-preview {
    width: min(640px, calc(100vw - 32px));
    max-height: calc(100vh - 48px);
    padding: 0;
    display: flex; flex-direction: column;
    background: var(--ink); color: var(--fog);
    border: 1px solid var(--brass); border-radius: 8px;
    font-family: var(--font);
    color-scheme: dark;
  }
  .creature-preview:not([open]) { display: none; }
  .creature-preview::backdrop { background: rgba(10, 14, 18, .55); }
  .cp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }
  .cp-body .statblock-holder { margin: 0; max-height: none; font-size: 15px; }
  .cp-foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid rgba(184, 137, 58, .35); }
  .cp-note { flex: 1; font-size: 13px; opacity: .7; }
  .cp-foot .btn:disabled { opacity: .5; cursor: default; }
  /* Merge checklist */
  .statblock-holder.is-merging { background: none; border: none; padding: 0; }
  .merge-list { display: flex; flex-direction: column; gap: 10px; }
  .merge-intro { margin: 0; font-size: 14px; opacity: .8; }
  .merge-group { gap: 4px; }
  .merge-item { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
  .merge-item:hover { background: rgba(184, 137, 58, .1); }
  .merge-item input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--brass); }
  .merge-item.is-disabled { opacity: .45; cursor: default; }
  .merge-item.is-disabled:hover { background: none; }
  .merge-text { display: flex; flex-direction: column; gap: 1px; }
  .merge-text strong { font-weight: normal; color: #e8c2bb; }
  .merge-detail { font-size: 13px; opacity: .7; line-height: 1.35; }
  .bst-result.is-creature { border-left: 3px solid #8fb8e0; }
  .bst-result.is-creature .bst-result-source { color: #8fb8e0; opacity: .85; }

  /* Spell card column in the Bestiary, and the popup elsewhere */
  .bst-spellcol-body { overflow-y: auto; min-height: 0; }
  .bst-spellcol-body .spell-card { max-width: none; }
  .spell-popup { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; background: none; border: none; overflow: visible; }
  .spell-popup::backdrop { background: rgba(10, 14, 18, .55); }
  .spell-popup-body { max-height: calc(100vh - 48px); overflow-y: auto; border-radius: 10px; }
  .spell-popup-body .spell-card { max-width: none; }
  .spell-popup-close { position: absolute; top: 8px; right: 8px; z-index: 1; color: #fff; background: rgba(0, 0, 0, .25); border-radius: 50%; }

  /* Initiative: large centered view */
  .init-modal {
    width: min(960px, calc(100vw - 32px));
    max-height: calc(100vh - 48px);
    padding: 0;
    background: none;
    border: none;
  }
  .init-modal::backdrop { background: rgba(10, 14, 18, .65); }
  .init-tracker.is-large {
    width: 100%;
    max-height: calc(100vh - 48px);
    padding: 18px 22px;
    font-size: 19px;
    border-radius: 8px;
  }
  .init-tracker.is-large:focus { outline: none; }
  .is-large .dm-title { font-size: 18px; }
  .is-large .init-round { font-size: 17px; }
  .is-large .dm-tools { gap: 8px; }
  .is-large .dm-tools .btn, .is-large .btn { font-size: 17px; padding: 5px 14px; }
  .is-large .icon-btn { width: 36px; height: 36px; font-size: 19px; }
  .is-large .init-table { gap: 6px; margin-top: 14px; }
  .is-large .init-row { grid-template-columns: 22px 34px 72px minmax(0, 1fr) 84px 84px 68px 26px 36px 40px 40px; gap: 8px; padding: 2px 0; }
  .is-large .init-cols { font-size: 14px; }
  .is-large .turn-mark { font-size: 16px; }
  .is-large .init-row.is-turn { background: rgba(184, 137, 58, .26); box-shadow: inset 3px 0 0 var(--brass); }
  .is-large .init-input, .is-large .init-select, .is-large .init-notes { font-size: 19px; padding: 6px 8px; }
  .is-large .move-btn { width: 26px; height: 17px; font-size: 11px; }
  .is-large .init-notes { margin-left: 30px; width: calc(100% - 30px); }
  .is-large .hp-adjust { gap: 10px; margin-top: 14px; padding-top: 14px; }
  .is-large .hp-pills { gap: 6px; max-height: 210px; }
  .is-large .hp-pill { font-size: 17px; padding: 4px 13px; }
  .is-large .hp-pill-hp { font-size: 14px; }
  .is-large .hp-pill-name { max-width: 260px; }
  .is-large .hp-controls { grid-template-columns: minmax(90px, 1fr) auto auto; gap: 8px; }
  .is-large .init-add { margin-top: 10px; }
  .is-large .init-encounters, .is-large .init-foot { margin-top: 12px; gap: 8px; }
  .is-large .dm-status { font-size: 15px; }
  @media (max-width: 640px) {
    .is-large .init-row { grid-template-columns: 14px 26px 48px minmax(0, 1fr) 54px 54px 44px 20px 28px 30px 30px; gap: 4px; }
    .init-tracker.is-large { font-size: 16px; padding: 12px; }
    .is-large .init-input { font-size: 16px; padding: 4px; }
  }

  /* Sides and hiding */
  .side-chip {
    width: 22px; height: 22px; padding: 0;
    display: grid; place-items: center;
    border-radius: 4px; border: 1px solid currentColor;
    background: none; font: inherit; font-size: 12px; font-weight: bold; cursor: pointer;
  }
  .side-chip.side-party { color: #8fb8e0; }
  .side-chip.side-ally { color: #9fd8a8; }
  .side-chip.side-hostile { color: #ff9b8a; }
  .side-chip:hover { background: rgba(232, 236, 239, .1); }
  .is-large .side-chip { width: 32px; height: 32px; font-size: 16px; }
  .eye-btn { font-size: 13px; }
  .eye-btn.is-off { opacity: .5; }
  .init-row.is-hidden { opacity: .45; }
  .init-row.is-hidden .init-name { font-style: italic; }

  /* Party at a glance (above the session links) */
  .party-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 14px; }
  .party-table thead th { font-size: 11px; font-weight: normal; letter-spacing: .06em; text-transform: uppercase; color: var(--brass); text-align: center; padding: 0 4px 4px; }
  .party-table thead th:first-child { text-align: left; }
  .party-table tbody th { text-align: left; font-weight: normal; padding: 3px 4px 3px 0; max-width: 0; width: 100%; }
  .party-table td { text-align: center; padding: 3px 6px; font-variant-numeric: tabular-nums; font-size: 16px; min-width: 34px; }
  .party-table tbody tr + tr { border-top: 1px solid rgba(184, 137, 58, .18); }
  .party-name {
    display: block; width: 100%; padding: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: none; border: none; color: var(--fog); font: inherit; text-align: left; cursor: pointer;
  }
  .party-name:hover { color: var(--brass); text-decoration: underline; }
  .party-name:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Party */
  .init-add-buttons { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; margin-top: 6px; }
  .init-add-buttons .init-add { margin-top: 0; }
  .party-btn-add { color: #8fb8e0; border-color: rgba(143, 184, 224, .6); white-space: nowrap; }
  .init-search { grid-template-columns: minmax(0, 1fr) auto auto; }
  .bst-check { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
  .bst-check input { width: 16px; height: 16px; accent-color: #8fb8e0; }
  .bst-item-party { flex: none; padding: 0 5px; border: 1px solid #8fb8e0; border-radius: 3px; color: #8fb8e0; font-size: 11px; font-weight: bold; }
  .sb-character { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0; border-top: 1px solid rgba(224, 123, 108, .35); }
  .party-tag { color: #8fb8e0; border-color: #8fb8e0; }

  /* Encounter difficulty */
  .enc { margin-top: 8px; border: 1px solid rgba(184, 137, 58, .35); border-radius: 6px; }
  .enc-summary {
    width: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 8px; background: none; color: var(--fog); border: none;
    font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  }
  .enc-summary:hover { background: rgba(184, 137, 58, .1); }
  .enc-title { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--brass); }
  .enc-caret { margin-left: auto; opacity: .7; }
  .enc-badge { padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; font-size: 12px; white-space: nowrap; }
  .diff-trivial { color: #aab2b8; }
  .diff-easy { color: #9fd8a8; }
  .diff-medium { color: #f0cf72; }
  .diff-hard { color: #f0a46a; }
  .diff-deadly { color: #ff8070; }
  .enc-body { padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .enc-party { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .enc-party .init-input { width: 52px; text-align: center; }
  .enc-label { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--brass); }
  .enc-level { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; border: 1px solid rgba(143, 184, 224, .4); border-radius: 999px; color: #8fb8e0; }
  .enc-level .init-input { width: 44px; padding: 1px 2px; }
  .enc-hint, .enc-note { opacity: .6; font-size: 12px; margin: 0; }
  .enc-table { display: flex; flex-direction: column; gap: 2px; }
  .enc-row { display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(2, minmax(0, 1fr)); gap: 6px; }
  .enc-row .enc-v { font-variant-numeric: tabular-nums; }
  .enc-head { font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
  .enc-k { opacity: .8; }
  .enc-thresholds { display: flex; flex-wrap: wrap; gap: 6px; }
  .enc-th { padding: 1px 8px; border: 1px solid currentColor; border-radius: 4px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .enc-warn { margin: 0; color: #e6c35c; font-size: 12px; }
  .is-large .enc-summary, .is-large .enc-body { font-size: 16px; }
  .is-large .enc-badge, .is-large .enc-th { font-size: 15px; }
  .is-large .enc-title, .is-large .enc-label { font-size: 14px; }

  /* DM view extras in popups and the places-within list */
  .popup-dm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; padding-top: 6px; border-top: 1px dashed rgba(184, 137, 58, .4); }
  .sub-list li { display: flex; align-items: center; gap: 4px; }
  .sub-list li .sub-row { flex: 1; min-width: 0; }

  /* Unsaved-changes pill (editor and DM view): loud on purpose */
  .unsaved-banner {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    z-index: 1100;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: calc(100% - 24px);
    padding: 7px 8px 7px 14px;
    background: #5a1f1a;
    color: #ffe1db;
    border: 2px solid #e0574a;
    border-radius: 999px;
    box-shadow: 0 0 0 4px rgba(224, 87, 74, .28), 0 8px 24px rgba(0, 0, 0, .5);
    font-family: var(--font);
    font-size: 15px;
    animation: unsaved-pulse 1.6s ease-in-out infinite;
  }
  .unsaved-icon { font-size: 18px; color: #ffb3a7; }
  .unsaved-text { min-width: 0; overflow-wrap: anywhere; }
  .unsaved-save {
    flex: none;
    padding: 5px 14px;
    background: #e0574a;
    color: #1d0c09;
    border: none;
    border-radius: 999px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .unsaved-save:hover { background: #f2705f; }
  .unsaved-save:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .unsaved-save:disabled { opacity: .6; cursor: default; }
  .unsaved-banner.is-saving { animation: none; border-color: var(--brass); background: rgba(26, 34, 41, .95); color: var(--fog); box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
  .unsaved-banner.is-saving .unsaved-save { background: var(--brass); }
  @keyframes unsaved-pulse {
    50% { box-shadow: 0 0 0 10px rgba(224, 87, 74, .12), 0 8px 24px rgba(0, 0, 0, .5); }
  }
  @media (prefers-reduced-motion: reduce) { .unsaved-banner { animation: none; } }
  /* Below ~1240px the drift bar and initiative tracker can crowd the bottom center,
     so the pill moves up under the search bar instead */
  @media (max-width: 1240px) { .unsaved-banner { bottom: auto; top: 56px; } }

  /* View switcher inside the layers menu (only shown to you) */
  .view-switch { margin: 6px 0 0; padding: 6px 0 0; border: none; border-top: 1px solid rgba(184, 137, 58, .4); }
  .view-switch legend { padding: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--brass); }
  .view-switch label { display: flex; align-items: center; gap: 6px; }
  .view-switch input { accent-color: var(--brass); }

  .preview-badge {
    position: absolute; right: 10px; bottom: 10px;
    z-index: 1000;
    padding: 4px 10px;
    background: rgba(26, 34, 41, .92);
    color: #e6c35c;
    border: 1px solid #e6c35c;
    border-radius: 999px;
    font-family: var(--font);
    font-size: 13px;
    pointer-events: none;
  }

  /* The pin whose details are open */
  .place-pin.is-selected .dot { filter: drop-shadow(0 0 4px var(--brass)) drop-shadow(0 0 8px var(--brass)); }

  /* Brief glow on whatever the search just jumped to */
  .is-found { animation: found-glow .8s ease-in-out 3; }
  @keyframes found-glow {
    50% { filter: drop-shadow(0 0 6px var(--brass)) drop-shadow(0 0 14px var(--brass)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .is-found { animation: none; filter: drop-shadow(0 0 6px var(--brass)); }
  }

  /* Party marker: a simple "you are here" dot with a soft pulse */
  .party-marker { background: none; border: none; }
  .party-dot {
    position: absolute; inset: 6px;
    border-radius: 50%;
    background: var(--beacon);
    border: 2px solid var(--fog);
    box-shadow: 0 1px 4px rgba(26, 34, 41, .6);
  }
  .party-pulse {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: rgba(228, 87, 46, .45);
    animation: party-pulse 2.2s ease-out infinite;
  }
  @keyframes party-pulse {
    from { transform: scale(.5); opacity: 1; }
    to   { transform: scale(1.9); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .party-pulse { animation: none; transform: scale(1.2); opacity: .5; }
  }
  .editing:not(.fog-tool) .party-marker { cursor: move; }

  /* Edit mode affordances */
  .editing:not(.fog-tool) .island-label span { cursor: move; outline: 1px dashed rgba(184, 137, 58, .9); padding: 0 4px; }
  .editing:not(.fog-tool) .place-pin { cursor: move; }
  .editing.leaflet-container { cursor: crosshair; }
  .brush-cursor {
    position: absolute;
    display: none;
    z-index: 1000;
    pointer-events: none;
    border: 1px solid var(--fog);
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(26, 34, 41, .6);
  }

  /* Panels */
  .drift-panel, .edit-panel {
    background: rgba(26, 34, 41, .9);
    color: var(--fog);
    border: 1px solid var(--brass);
    border-radius: 6px;
    font-family: var(--font);
    font-size: 15px;
  }
  .drift-panel { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; }
  .drift-panel .play {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    background: none;
    color: var(--brass);
    border: 1px solid var(--brass);
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
  }
  .drift-panel .play:hover { background: rgba(184, 137, 58, .15); }
  .drift-panel label { display: flex; align-items: center; gap: 10px; }
  .drift-panel input[type=range] { width: 130px; accent-color: var(--brass); }
  .drift-panel output { min-width: 3.2em; font-variant-numeric: tabular-nums; }

  .edit-panel {
    width: 250px;
    max-height: calc(100vh - 110px);
    overflow-y: auto;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .edit-panel h2 { margin: 0; font-size: 18px; font-weight: normal; color: var(--brass); }
  .edit-head { display: flex; align-items: center; justify-content: space-between; }
  .gear-btn {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    padding: 0;
    background: none;
    color: var(--brass);
    border: 1px solid transparent;
    border-radius: 4px;
    cursor: pointer;
  }
  .gear-btn:hover { border-color: var(--brass); background: rgba(184, 137, 58, .12); }

  /* Settings modal */
  .settings-modal {
    width: min(640px, calc(100vw - 32px));
    max-height: calc(100vh - 48px);
    padding: 0;
    background: var(--ink);
    color: var(--fog);
    border: 1px solid var(--brass);
    border-radius: 8px;
    font-family: var(--font);
    font-size: 15px;
  }
  .settings-modal::backdrop { background: rgba(10, 14, 18, .6); }
  .settings-form { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
  .settings-head, .settings-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
  .settings-head { justify-content: space-between; border-bottom: 1px solid rgba(184, 137, 58, .35); }
  .settings-head h2 { margin: 0; font-size: 20px; font-weight: normal; color: var(--brass); }
  .settings-x {
    width: 30px; height: 30px; padding: 0;
    background: none; color: var(--fog); border: none; border-radius: 4px;
    font-size: 22px; line-height: 1; cursor: pointer;
  }
  .settings-x:hover { background: rgba(184, 137, 58, .2); }
  .settings-body { overflow-y: auto; padding: 14px 16px; }
  .settings-foot { justify-content: flex-end; border-top: 1px solid rgba(184, 137, 58, .35); }
  .settings-note { margin: 0 auto 0 0; color: var(--rust); font-size: 14px; }
  .settings-section h3 { margin: 0 0 2px; font-size: 16px; font-weight: normal; letter-spacing: .04em; text-transform: uppercase; color: var(--brass); }
  .settings-help { margin: 0 0 10px; opacity: .75; font-size: 14px; }

  .type-head, .type-row {
    display: grid;
    grid-template-columns: 28px minmax(120px, 1fr) 44px 58px 58px 52px 88px;
    align-items: center;
    gap: 8px;
  }
  .type-head { padding: 0 7px 4px; font-size: 12px; opacity: .7; }
  .type-head span:nth-child(6) { text-align: center; }
  .type-list { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .type-row { padding: 6px; background: rgba(232, 236, 239, .04); border: 1px solid rgba(184, 137, 58, .25); border-radius: 6px; }
  .type-preview { display: grid; place-items: center; height: 28px; }
  .type-preview .dot { display: block; border: 1px solid var(--fog); transform: rotate(45deg); }
  .type-row input[type=text], .type-row input[type=number] {
    box-sizing: border-box; width: 100%;
    padding: 4px 6px;
    background: rgba(232, 236, 239, .08);
    color: var(--fog);
    border: 1px solid rgba(184, 137, 58, .6);
    border-radius: 3px;
    font: inherit;
  }
  .type-row input[type=color] { width: 40px; height: 30px; padding: 0 2px; background: none; border: 1px solid rgba(184, 137, 58, .6); border-radius: 3px; cursor: pointer; }
  .type-row input[type=radio] { justify-self: center; accent-color: var(--brass); width: 16px; height: 16px; }
  .type-actions { display: flex; gap: 2px; }
  .icon-btn {
    width: 28px; height: 28px; padding: 0;
    background: none; color: var(--fog);
    border: 1px solid transparent; border-radius: 4px;
    font-size: 15px; line-height: 1; cursor: pointer;
  }
  .icon-btn:hover:not(:disabled) { border-color: rgba(184, 137, 58, .6); }
  .icon-btn.danger:hover:not(:disabled) { color: var(--rust); border-color: var(--rust); }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .settings-modal button:focus-visible, .settings-modal input:focus-visible { outline: 2px solid var(--fog); outline-offset: 2px; }

  @media (max-width: 560px) {
    .type-head { display: none; }
    .type-row { grid-template-columns: 44px 1fr 1fr 44px; }
    .type-preview { grid-column: 1; grid-row: 1; }
    .type-label { grid-column: 2 / 5; grid-row: 1; }
    .type-color { grid-column: 1; grid-row: 2; }
    .type-dot { grid-column: 2; grid-row: 2; }
    .type-font { grid-column: 3; grid-row: 2; }
    .type-default { grid-column: 4; grid-row: 2; }
    .type-actions { grid-column: 1 / -1; grid-row: 3; justify-content: flex-end; }
  }
  .edit-panel p { margin: 0; line-height: 1.35; }
  .edit-panel .muted { opacity: .75; font-size: 14px; }
  .editor-save { margin-top: 0; }
  .editor-save .dm-status { font-size: 14px; }
  .edit-panel .notion-error { color: var(--rust); font-size: 14px; overflow-wrap: anywhere; }
  .edit-panel hr { width: 100%; border: none; border-top: 1px solid rgba(184, 137, 58, .4); margin: 2px 0; }
  .edit-panel .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .edit-panel .slider input { grid-column: 1 / -1; accent-color: var(--brass); }
  .edit-panel .check { display: flex; align-items: center; gap: 6px; }
  .edit-panel .check input { accent-color: var(--brass); }

  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--fog); outline-offset: 2px;
  }

  .btn {
    background: none;
    color: var(--brass);
    border: 1px solid var(--brass);
    border-radius: 4px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  .btn:hover { background: rgba(184, 137, 58, .15); }
  .btn.primary, .btn[aria-pressed=true] { background: var(--brass); color: var(--ink); }
  .btn.danger { color: var(--rust); border-color: var(--rust); }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg { display: flex; }
  .seg .btn { flex: 1; border-radius: 0; padding: 4px 6px; }
  .seg .btn + .btn { border-left: none; }
  .seg .btn:first-child { border-radius: 4px 0 0 4px; }
  .seg .btn:last-child { border-radius: 0 4px 4px 0; }

  /* Popups */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--ink);
    color: var(--fog);
    border: 1px solid var(--brass);
  }
  .leaflet-popup-content { font-family: var(--font); font-size: 15px; margin: 12px 14px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--fog); }
  .popup-name { font-size: 18px; }
  .popup-kind { opacity: .75; font-style: italic; }
  .popup-note { margin: 6px 0 0; white-space: pre-wrap; }
  .popup-aliases { margin-top: 2px; opacity: .75; font-size: 14px; }
  .leaflet-container a.popup-link { display: inline-block; margin-top: 8px; color: var(--brass); }
  .leaflet-container a.popup-link:hover { color: var(--fog); }

  .place-form { display: flex; flex-direction: column; gap: 8px; }
  .place-form h3 { margin: 0; font-size: 17px; font-weight: normal; color: var(--brass); }
  .place-form label { display: flex; flex-direction: column; gap: 3px; }
  .place-form fieldset { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .place-form fieldset label { flex-direction: row; align-items: center; gap: 6px; }
  .place-form input[type=text], .place-form input[type=url], .place-form textarea, .place-form select {
    box-sizing: border-box;
    width: 100%;
    padding: 4px 6px;
    background: rgba(232, 236, 239, .08);
    color: var(--fog);
    border: 1px solid rgba(184, 137, 58, .6);
    border-radius: 3px;
    font: inherit;
  }
  .place-form select option { background: var(--ink); }
  .place-form input[type=radio] { accent-color: var(--brass); }
  .place-form label.inline { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; }
  .place-form input[type=checkbox] { accent-color: var(--brass); }

  /* Notion location picker */
  .loc-picker { display: flex; flex-direction: column; gap: 4px; }
  .combo-list {
    list-style: none;
    margin: 2px 0 0;
    padding: 4px 0;
    max-height: 180px;
    overflow-y: auto;
    background: var(--ink);
    border: 1px solid rgba(184, 137, 58, .6);
    border-radius: 3px;
  }
  .combo-option {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .combo-option.is-active, .combo-option:hover { background: rgba(184, 137, 58, .2); }
  .combo-option[aria-selected=true] { color: var(--brass); }
  .combo-option.is-none { font-style: italic; opacity: .8; }
  .combo-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .combo-detail { flex: none; font-size: 12px; opacity: .7; }
  .combo-note { padding: 4px 8px; font-size: 13px; opacity: .7; }
  .loc-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 20px; }
  .tag {
    padding: 0 7px;
    border: 1px solid currentColor;
    border-radius: 999px;
    font-size: 12px;
    font-style: normal;
    line-height: 18px;
    white-space: nowrap;
  }
  .tag-public { color: #8fc79a; }
  .tag-private { color: var(--rust); }
  .tag-warn { color: #e6c35c; }
  .tag-muted { color: rgba(232, 236, 239, .7); }
  .leaflet-container a.loc-open { color: var(--brass); font-size: 13px; }
  .leaflet-container a.dm-link { color: #c9a0dc; }
  /* The same link colors inside modals (they live outside the map container) */
  a.loc-open { color: var(--brass); font-size: 13px; }
  a.dm-link { color: #c9a0dc; }
  a.loc-open:hover, a.dm-link:hover { color: var(--fog); }
  .sub-chip .dm-link { flex: none; }

  /* "Places within" field in the pin form */
  .sub-field { display: flex; flex-direction: column; gap: 4px; }
  .sub-chips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .sub-chips:empty { display: none; }
  .sub-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 4px 2px 8px;
    background: rgba(232, 236, 239, .06);
    border: 1px solid rgba(184, 137, 58, .4);
    border-radius: 4px;
  }
  .sub-chip-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-remove {
    flex: none;
    width: 22px; height: 22px;
    padding: 0;
    background: none;
    color: var(--fog);
    border: none;
    border-radius: 3px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .chip-remove:hover { background: rgba(224, 138, 122, .25); color: var(--rust); }

  .leaflet-control-layers {
    font-family: var(--font);
    font-size: 15px;
    background: rgba(26, 34, 41, .9) !important;
    color: var(--fog) !important;
    border: 1px solid var(--brass) !important;
  }
  .leaflet-control-layers input { accent-color: var(--brass); }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="index.js"></script>
</body>
</html>
